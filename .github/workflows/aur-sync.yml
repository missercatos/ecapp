name: aur-sync

# Manually sync the AUR packages (ecapp and ecapp-bin) for an already
# published release, using the release artifact's real sha256.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to sync, without the leading v (e.g. 0.3.2)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch release artifact and hash it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TARBALL="ecapp-v${VERSION}-x86_64-linux.tar.gz"
          mkdir -p /tmp/rel
          gh release download "v${VERSION}" --pattern "$TARBALL" --dir /tmp/rel --clobber
          SHA256=$(sha256sum "/tmp/rel/$TARBALL" | cut -d' ' -f1)
          {
            echo "VERSION=$VERSION"
            echo "SHA256=$SHA256"
          } >> "$GITHUB_ENV"
          echo "Syncing $TARBALL (sha256=$SHA256)"

      - name: set up AUR ssh key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              IdentityFile ~/.ssh/aur_key
              User aur
              StrictHostKeyChecking accept-new
          EOF

      - name: sync AUR packages
        run: |
          set -ex
          for repo in ecapp ecapp-bin; do
            rm -rf "/tmp/aur-$repo"
            git clone "ssh://aur@aur.archlinux.org/${repo}.git" "/tmp/aur-$repo"
            (
              cd "/tmp/aur-$repo"
              sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
              sed -i "s/^sha256sums=('.*')/sha256sums=('$SHA256')/" PKGBUILD
              sed -i "s/^\tpkgver = .*/\tpkgver = $VERSION/" .SRCINFO
              sed -i "s/^\tsha256sums = .*/\tsha256sums = $SHA256/" .SRCINFO
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add PKGBUILD .SRCINFO
              git commit -m "update to v${VERSION}"
              git push
            )
          done

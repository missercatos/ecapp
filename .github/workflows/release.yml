name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: build
        run: cargo build --release --locked

      - name: package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="ecapp-v${VERSION}-x86_64-linux.tar.gz"
          mkdir -p dist
          cp target/release/ecapp dist/
          tar czf "dist/$TARBALL" -C dist ecapp
          SHA256=$(sha256sum "dist/$TARBALL" | cut -d' ' -f1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/${{ steps.package.outputs.tarball }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: sync aur packages
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -ex
          VERSION="${{ steps.package.outputs.version }}"
          SHA256="${{ steps.package.outputs.sha256 }}"

          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              IdentityFile ~/.ssh/aur_key
              User aur
              StrictHostKeyChecking accept-new
          EOF

          for repo in ecapp ecapp-bin; do
            rm -rf "/tmp/aur-$repo"
            git clone "ssh://aur@aur.archlinux.org/${repo}.git" "/tmp/aur-$repo"
            (
              cd "/tmp/aur-$repo"
              sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
              sed -i "s/^sha256sums=('.*')/sha256sums=('$SHA256')/" PKGBUILD
              sed -i "s/^\tpkgver = .*/\tpkgver = $VERSION/" .SRCINFO
              sed -i "s/^\tsha256sums = .*/\tsha256sums = $SHA256/" .SRCINFO
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add PKGBUILD .SRCINFO
              if git diff --cached --quiet; then
                echo "$repo already up to date"
              else
                git commit -m "update to v${VERSION}"
                git push
              fi
            )
          done
